name: Compose startup check
# backend/compose.yml 이 실제로 기동되는지 확인한다.
#
# postgres 17 → 18 업그레이드 때 이미지 태그만 바뀌고 볼륨 경로가 그대로 남아
# develop 의 로컬 DB 가 기동 불능이 된 적이 있다. compose.yml 은 CI 가 보지 않던
# 유일한 설정 파일이라 머지까지 아무 검사도 걸리지 않았다.
#
# 컨테이너를 한 번 띄웠다 내리는 것이 전부다. 기능은 보지 않고 "뜨는가"만 본다.

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/compose.yml'
      - '.github/workflows/compose-check.yml'
  pull_request:
    paths:
      - 'backend/compose.yml'
      - '.github/workflows/compose-check.yml'

jobs:
  startup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 계정·비번을 워크플로에 적지 않는다. 잡이 끝나면 사라지는 컨테이너라
      # 매 실행마다 즉석에서 만든 값을 쓰면 되고, 그러면 새어나갈 값이 없다.
      - name: Generate throwaway .env
        run: |
          {
            echo "DB_NAME=citest"
            echo "DB_USERNAME=citest"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
          } > .env

      # --wait 는 healthcheck 가 통과할 때까지 기다리고, 안 되면 실패한다.
      - name: Start services
        run: docker compose up --detach --wait

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes
