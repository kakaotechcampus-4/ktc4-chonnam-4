name: Frontend CI
# 팀 자체 CI. feature/* → develop PR 에서도 돌아야 하므로 base 를 좁히지 않는다.
# (운영 워크플로인 convention-check 는 base=main 한정이라 팀 내부 PR 에서 안 돈다)
# 로컬에서 같은 검사: bash scripts/verify.sh frontend

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'contracts/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'contracts/**'
      - '.github/workflows/frontend-ci.yml'

# 같은 PR 에 새로 push 하면 이전 실행을 취소한다. develop·main push 는 취소하지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-build-test:
    # ubuntu-latest 는 2026-10-19 ~ 11-19 사이 26.04 로 바뀐다. 검증한 24.04 LTS 로 고정한다.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (frontend/.nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # 앞 단계가 실패해도 build·test 까지 돌려서 한 번에 모든 실패를 보여 준다.
      - name: Build (tsc 타입검사 포함)
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Test
        if: ${{ !cancelled() }}
        run: npm run test:coverage

      - name: Test summary
        if: ${{ !cancelled() && hashFiles('frontend/test-results/vitest-junit.xml') != '' }}
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: frontend/test-results/vitest-junit.xml

      # 커버리지는 참고용이다. 통과 기준으로 쓰지 않는다.
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('frontend/coverage/index.html') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7
