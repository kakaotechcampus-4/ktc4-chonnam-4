name: Dev server
# 팀원용 버튼 하나. Actions → Dev server → Run workflow 에서 할 일을 고른다(PR 미리보기는 PR 번호도).
#   상태 보기          서버 켜짐/꺼짐, 지금 올라간 것(develop·PR 미리보기), 미리보기 자리, 대문(CloudFront), 권한
#   켜기               서버 켜기 → 대문에 새 서버 주소를 넣고 열기 → develop 최신이 아니면 맞추기 → 테스트 주소로 확인
#   PR 미리보기 올리기  (꺼져 있으면 켜기부터) PR 을 develop 에 합친 코드로 화면·API 를 띄운다. 미리보기 전용 DB 는 매번 새로
#   미리보기 끝내기     develop 최신으로 되돌리고 미리보기 DB·자리를 지운다
#   끄기               대문 닫기 → 다 닫힌 것 확인 → 서버 끄기(누르고 떠나도 된다)
# 한 번에 PR 하나만 띄운다(자리 1시간, 같은 PR 을 다시 올리면 연장). 다른 PR 이 쓰는 중이면 누가·언제까지인지 알려 주고 멈춘다.
# PR 미리보기는 같은 레포의 열린 PR(→ develop)만 된다. 포크 PR·충돌이 있는 PR 은 안 된다.
# 결과 보고서는 실행 화면의 Summary 다. 공개 레포라 테스트 주소·계정 ID·서버 주소는 찍지 않는다(주소는 디스코드 고정 메시지).
# 고정 IP 가 없어 서버를 껐다 켜면 주소가 바뀐다. 그래서 끌 때는 대문을 먼저 닫고(다 닫힌 것을 본 뒤) 서버를 끈다
# (docs/cd-architecture.md §8). 대문 여닫기는 Terraform 밖이다(scripts/edge-toggle.sh, 승인 없이 몇 초).

on:
  workflow_dispatch:
    inputs:
      action:
        description: 할 일
        type: choice
        options:
          - 상태 보기
          - 켜기
          - PR 미리보기 올리기
          - 미리보기 끝내기
          - 끄기
        default: 상태 보기
      pr:
        description: PR 번호(PR 미리보기 올리기 때만, 예 41)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    # 다른 브랜치를 고르면 그 브랜치의 워크플로·스크립트가 배포 역할로 돈다. develop 에서만 받는다.
    if: github.ref == 'refs/heads/develop'
    # ubuntu-latest 는 2026-10-19 ~ 11-19 사이 26.04 로 바뀐다. 검증한 24.04 LTS 로 고정한다.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      power_on: ${{ steps.what.outputs.power_on }}
      release: ${{ steps.what.outputs.release }}
      power_off: ${{ steps.what.outputs.power_off }}
      mode: ${{ steps.what.outputs.mode }}
      sha: ${{ steps.what.outputs.sha }}
      pr: ${{ steps.what.outputs.pr }}
      title: ${{ steps.what.outputs.title }}
      author: ${{ steps.what.outputs.author }}
      head: ${{ steps.what.outputs.head }}
      base: ${{ steps.what.outputs.base }}
      deploy_changed: ${{ steps.what.outputs.deploy_changed }}
      end_preview: ${{ steps.what.outputs.end_preview }}

    steps:
      - name: Decide what to do
        id: what
        env:
          ACTION: ${{ inputs.action }}
          PR: ${{ inputs.pr }}
          ACTOR: ${{ github.actor }}
          DEVELOP_SHA: ${{ github.sha }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          out() { echo "$1=$2" >>"$GITHUB_OUTPUT"; }
          fail() { echo "::error title=Dev server::$1"; printf '## Dev server — %s ❌\n\n%s\n' "$ACTION" "$1" >>"$GITHUB_STEP_SUMMARY"; exit 1; }
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || fail "저장소 변수 AWS_ACCOUNT_ID(12자리)가 없다(관리자가 한 번 등록한다)."
          [[ "$ACTOR" =~ ^[A-Za-z0-9-]{1,39}$ ]] || fail "누른 사람 아이디 모양이 틀렸다."
          power_on=false release=false power_off=false mode=develop end_preview=false sha=$DEVELOP_SHA
          steps=()
          case $ACTION in
            "상태 보기")
              steps=("서버·대문·올라간 것·자리·권한을 읽기만 한다(아무것도 바꾸지 않는다)") ;;
            "켜기")
              power_on=true release=true
              steps=("서버 켜기(꺼져 있으면)" "대문(CloudFront)에 새 서버 주소를 넣고 열기" "develop 최신 \`${sha:0:7}\` 으로 맞추기(이미 떠 있으면 그대로)" "테스트 주소로 화면·API 확인") ;;
            "PR 미리보기 올리기")
              [[ "$PR" =~ ^[0-9]{1,6}$ ]] || fail "PR 번호를 숫자로 넣는다(예 41)."
              pr=$(gh api "repos/$REPO/pulls/$PR") || fail "PR #$PR 을 찾지 못했다."
              field() { jq -r "$1" <<<"$pr"; }
              [ "$(field .state)" = open ] || fail "PR #$PR 이 열려 있지 않다."
              [ "$(field .base.ref)" = develop ] || fail "PR #$PR 은 develop 으로 가는 PR 이 아니다."
              [ "$(field .head.repo.full_name)" = "$REPO" ] ||
                fail "PR #$PR 은 포크에서 온 PR 이다. 미리보기는 같은 레포 브랜치만 된다(자격증명이 있는 서버에서 돌기 때문). 브랜치를 이 레포에 올려 PR 을 다시 연다."
              # GitHub 이 PR 을 develop 에 합친 결과(머지 커밋)를 계산할 때까지 기다린다.
              for _ in $(seq 1 20); do
                mergeable=$(field .mergeable)
                [ "$mergeable" != null ] && break
                sleep 3
                pr=$(gh api "repos/$REPO/pulls/$PR")
              done
              [ "$mergeable" = true ] || fail "PR #$PR 은 develop 과 충돌이 있다(또는 아직 계산 중). develop 을 받아(merge·rebase) 충돌을 푼 뒤 다시 누른다."
              sha=$(field .merge_commit_sha)
              head=$(field .head.sha)
              [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || fail "합친 커밋을 받지 못했다. 잠시 뒤 다시 누른다."
              parents=$(gh api "repos/$REPO/commits/$sha" --jq '[.parents[].sha] | join(" ")')
              read -r base second <<<"$parents"
              [ "$second" = "$head" ] || fail "합친 커밋이 PR 의 최신 커밋을 담고 있지 않다(방금 push 했으면 잠시 뒤 다시 누른다)."
              gh api "repos/$REPO/contents/frontend/Dockerfile?ref=$sha" >/dev/null 2>&1 ||
                fail "이 PR 을 합친 코드에 화면 이미지(frontend/Dockerfile)가 없다. develop 을 받은 뒤 다시 누른다."
              deploy_changed=false
              files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
              if grep -q '^deploy/' <<<"$files"; then deploy_changed=true; fi
              out pr "$PR"
              out title "$(field .title | tr -d '\r\n' | cut -c1-100)"
              out author "$(field .user.login)"
              out head "$head"
              out base "$base"
              out deploy_changed "$deploy_changed"
              power_on=true release=true mode=preview
              steps=("서버가 꺼져 있으면 켜고 대문 열기" "PR #$PR 을 develop 에 합친 코드 \`${sha:0:7}\` 로 화면·백엔드 이미지 빌드(AWS 권한 없는 곳에서)" \
                "자리 확인(다른 PR 이 쓰는 중이면 멈춤) → 미리보기 전용 DB 새로 만들기 → 바꿔 띄우기 → 상태 확인" "테스트 주소로 화면·API·커밋 확인") ;;
            "미리보기 끝내기")
              release=true end_preview=true
              steps=("develop 최신 \`${sha:0:7}\` 으로 되돌리기(배포 전 백업)" "미리보기 DB·계정·자리 지우기") ;;
            "끄기")
              power_off=true
              steps=("다른 사람 미리보기가 자리를 쓰는 중이면 멈춤" "대문(CloudFront) 닫기 → 다 닫힌 것을 다시 읽어 확인" "배포·백업이 끝나길 기다린 뒤 서버 끄기") ;;
            *) fail "모르는 작업: $ACTION" ;;
          esac
          out power_on "$power_on"
          out release "$release"
          out power_off "$power_off"
          out mode "$mode"
          out sha "$sha"
          out end_preview "$end_preview"
          {
            echo "## Dev server — $ACTION"
            echo
            echo "누른 사람 **$ACTOR** · $(TZ=Asia/Seoul date '+%m/%d %H:%M') (KST)"
            echo
            echo "이 실행이 하는 일:"
            n=1
            for s in "${steps[@]}"; do echo "$n. $s"; n=$((n + 1)); done
          } >>"$GITHUB_STEP_SUMMARY"

  power_on:
    needs: plan
    if: needs.plan.outputs.power_on == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev
    # 켜기·끄기가 겹치지 않게 한 번에 하나(기다린다. 취소하지 않는다).
    concurrency:
      group: dev-server-power
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # GitHub OIDC 토큰으로 AWS 임시 자격증명(1시간)을 받는다
    outputs:
      was_off: ${{ steps.power.outputs.was_off }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          role-session-name: neuringo-dev-server-on
          aws-region: ap-northeast-2
          mask-aws-account-id: true

      - name: Read infra outputs
        id: infra
        run: bash scripts/infra-outputs.sh dev

      - name: Start server
        id: power
        run: |
          before=$(GITHUB_OUTPUT=/dev/null bash scripts/server-power.sh state | sed -n 's/^SERVER_STATE=//p')
          echo "was_off=$([ "$before" = running ] && echo false || echo true)" >>"$GITHUB_OUTPUT"
          code=0
          bash scripts/server-power.sh start || code=$?
          took=$(sed -n 's/^SERVER_SECONDS=//p' "$GITHUB_OUTPUT" | tail -n 1)
          {
            echo "### 서버 켜기"
            echo
            if [ "$code" = 77 ]; then
              echo "❌ 배포 역할에 서버 켜기 권한이 없다. AWS 콘솔(EC2 → 인스턴스 → 서버 체크 → **인스턴스 상태 ▼ → 인스턴스 시작**)에서 켠 뒤 같은 작업을 다시 누른다."
              echo "주황색 **인스턴스 시작** 버튼은 새 서버를 만드는 마법사다. 누르지 않는다."
            elif [ "$code" = 0 ]; then
              [ "$before" = running ] && echo "- 이미 켜져 있었다" || echo "- 켰다: ${took:-?}초(공인 주소가 생기고 SSM 이 붙을 때까지)"
            else
              echo "❌ 서버를 켜지 못했다(종료 코드 $code). 로그를 본다."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Open CloudFront with the new server address
        env:
          CF_DISTRIBUTION_ID: ${{ steps.infra.outputs.cloudfront_distribution_id }}
          DNS: ${{ steps.power.outputs.SERVER_DNS }}
        run: |
          out=$(bash scripts/edge-toggle.sh on "$DNS")
          echo "$out"
          value() { sed -n "s/^$1=//p" <<<"$out" | tail -n 1; }
          {
            echo
            echo "### 대문(CloudFront) 열기"
            echo
            if [ "$(value EDGE_RESULT)" = changed ]; then
              echo "- 새 서버 주소를 넣고 열었다($(value EDGE_SECONDS)초). 전 세계 엣지에 퍼지는 데 2~3분 걸린다(아래 확인이 기다린다)."
            else
              echo "- 이미 열려 있고 주소도 같다"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

  release:
    needs: [plan, power_on]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.release == 'true' && (needs.power_on.result == 'success' || needs.power_on.result == 'skipped')
    permissions:
      contents: read
      id-token: write # release.yml 의 잡들이 GitHub OIDC 로 AWS 임시 자격증명을 받는다
    uses: ./.github/workflows/release.yml
    with:
      sha: ${{ needs.plan.outputs.sha }}
      mode: ${{ needs.plan.outputs.mode }}
      pr: ${{ needs.plan.outputs.pr }}
      by: ${{ github.actor }}
      title: ${{ needs.plan.outputs.title }}
      author: ${{ needs.plan.outputs.author }}
      head: ${{ needs.plan.outputs.head }}
      base: ${{ needs.plan.outputs.base }}
      deploy_changed: ${{ needs.plan.outputs.deploy_changed == 'true' }}
      end_preview: ${{ needs.plan.outputs.end_preview == 'true' }}
      # 대문을 막 열었으면 퍼질 때까지(최대 5분) 기다리며 확인한다.
      edge_wait: ${{ needs.power_on.outputs.was_off == 'true' && 300 || 60 }}

  power_off:
    needs: plan
    if: needs.plan.outputs.power_off == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dev
    concurrency:
      group: dev-server-power
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # GitHub OIDC 토큰으로 AWS 임시 자격증명(1시간)을 받는다

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          role-session-name: neuringo-dev-server-off
          aws-region: ap-northeast-2
          mask-aws-account-id: true

      - name: Read infra outputs
        id: infra
        run: bash scripts/infra-outputs.sh dev

      # 다른 사람이 미리보기로 테스트하는 중이면 끄지 않는다. 그 사람이 끝내거나 자리 시간이 지난 뒤 끈다.
      - name: Nobody else is previewing?
        env:
          ACTOR: ${{ github.actor }}
        run: |
          state=$(GITHUB_OUTPUT=/dev/null bash scripts/server-power.sh state | sed -n 's/^SERVER_STATE=//p')
          [ "$state" = running ] || exit 0
          remote="$RUNNER_TEMP/status.sh"
          # shellcheck disable=SC2016 # $f 는 서버에서 풀린다
          printf '#!/usr/bin/env bash\nf=/opt/neuringo/current/deploy/host/status.sh\n[ -f "$f" ] && bash "$f" || echo LEASE_ACTIVE=0\n' >"$remote"
          out=$(bash scripts/ssm-run.sh "$remote" "status") || true
          value() { sed -n "s/^$1=//p" <<<"$out" | tail -n 1; }
          if [ "$(value LEASE_ACTIVE)" = 1 ] && [ "$(value LEASE_BY)" != "$ACTOR" ]; then
            until_kst=$(TZ=Asia/Seoul date -d "$(value LEASE_UNTIL)" '+%H:%M' 2>/dev/null || value LEASE_UNTIL)
            {
              echo "### 끄지 않았다 ⛔"
              echo
              echo "PR #$(value LEASE_PR) 미리보기를 **$(value LEASE_BY)** 님이 $until_kst (KST) 까지 쓰는 중이다."
              echo "그 사람이 **미리보기 끝내기**를 누르거나 시간이 지난 뒤 끈다. 급하면 먼저 알리고 미리보기 끝내기 → 끄기."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::error title=끄지 않음::다른 사람 미리보기가 자리를 쓰는 중"
            exit 1
          fi

      - name: Close CloudFront and wait until it is closed
        env:
          CF_DISTRIBUTION_ID: ${{ steps.infra.outputs.cloudfront_distribution_id }}
        run: |
          out=$(bash scripts/edge-toggle.sh off)
          echo "$out"
          value() { sed -n "s/^$1=//p" <<<"$out" | tail -n 1; }
          {
            echo "### 대문(CloudFront) 닫기"
            echo
            echo "- $([ "$(value EDGE_RESULT)" = changed ] && echo 닫았다 || echo '이미 닫혀 있었다') · 다 퍼진 것 확인(상태 $(value EDGE_STATUS), 켜짐 $(value EDGE_ENABLED)) · $(value EDGE_SECONDS)초"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Stop server
        run: |
          code=0
          out=$(bash scripts/server-power.sh stop) || code=$?
          echo "$out"
          value() { sed -n "s/^$1=//p" <<<"$out" | tail -n 1; }
          {
            echo
            echo "### 서버 끄기"
            echo
            case $code in
              0) echo "- 껐다($(value SERVER_HOW), $(value SERVER_SECONDS)초). 다시 쓸 때 **켜기**를 누른다. DB·마지막으로 올린 버전은 디스크에 남는다." ;;
              77) echo "❌ 배포 역할에 끄기 권한이 없다. 대문은 닫혀 있으니 AWS 콘솔(인스턴스 상태 ▼ → **인스턴스 중지**)에서 끈다. **인스턴스 종료**는 서버를 지우니 누르지 않는다." ;;
              *) echo "❌ 서버를 끄지 못했다(종료 코드 $code). 대문은 닫혀 있다. 로그를 본다." ;;
            esac
            echo
            echo "끄면 \"서버 꺼짐\" 경보 메일이 갈 수 있다(정상)."
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$code"

  status:
    needs: [plan, power_on, release, power_off]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: dev
    permissions:
      contents: read
      id-token: write # GitHub OIDC 토큰으로 AWS 임시 자격증명(1시간)을 받는다

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          role-session-name: neuringo-dev-server-status
          aws-region: ap-northeast-2
          mask-aws-account-id: true

      - name: Read infra outputs
        id: infra
        run: bash scripts/infra-outputs.sh dev

      - name: Report current state
        env:
          CF_DISTRIBUTION_ID: ${{ steps.infra.outputs.cloudfront_distribution_id }}
          DOMAIN: ${{ steps.infra.outputs.cloudfront_domain }}
          ACTION: ${{ inputs.action }}
        run: |
          power=$(GITHUB_OUTPUT=/dev/null bash scripts/server-power.sh state) || power=""
          edge=$(bash scripts/edge-toggle.sh status) || edge=""
          server=""
          state=$(sed -n 's/^SERVER_STATE=//p' <<<"$power")
          if [ "$state" = running ] && [[ "$DOMAIN" =~ ^[a-z0-9]+\.cloudfront\.net$ ]]; then
            remote="$RUNNER_TEMP/status.sh"
            # shellcheck disable=SC2016 # $f 는 서버에서 풀린다
            printf '#!/usr/bin/env bash\nf=/opt/neuringo/current/deploy/host/status.sh\nif [ -f "$f" ]; then EDGE_DOMAIN=%s bash "$f"; else echo STATUS_RELEASE=없음; fi\n' "$DOMAIN" >"$remote"
            server=$(bash scripts/ssm-run.sh "$remote" "status") || true
          fi
          perms=""
          if [ "$ACTION" = "상태 보기" ]; then perms=$(GITHUB_OUTPUT=/dev/null bash scripts/server-power.sh perms) || true; fi
          value() { sed -n "s/^$2=//p" <<<"$1" | tail -n 1; }
          kst() { [ -n "$1" ] && TZ=Asia/Seoul date -d "$1" '+%m/%d %H:%M' 2>/dev/null || echo "${1:-?}"; }
          yesno() { [ "$1" = yes ] && echo "✅ 있음" || echo "❌ 없음(콘솔에서)"; }
          case $state in
            running) server_line="🟢 켜짐" ;;
            stopped) server_line="⚪ 꺼짐" ;;
            "") server_line="? 읽지 못함" ;;
            *) server_line="🟡 $state" ;;
          esac
          enabled=$(value "$edge" EDGE_ENABLED)
          case "${enabled,,}:$(value "$edge" EDGE_STATUS)" in
            true:Deployed) edge_line="🟢 열림" ;;
            false:Deployed) edge_line="⚪ 닫힘" ;;
            true:*) edge_line="🟡 여는 중(퍼지는 중)" ;;
            false:*) edge_line="🟡 닫는 중(퍼지는 중)" ;;
            *) edge_line="? 읽지 못함" ;;
          esac
          release=$(value "$server" STATUS_RELEASE)
          mode=$(value "$server" STATUS_MODE)
          {
            echo
            echo "## 지금 상태"
            echo
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 서버 | $server_line |"
            echo "| 대문(CloudFront) | $edge_line |"
            if [ "$state" = running ]; then
              if [ "$mode" = preview ]; then
                echo "| 올라간 것 | PR #$(value "$server" STATUS_PR) 미리보기 \`${release:0:7}\` · $(value "$server" STATUS_BY) · $(kst "$(value "$server" STATUS_AT)") |"
              elif [ "$mode" = develop ]; then
                echo "| 올라간 것 | develop \`${release:0:7}\` · $(kst "$(value "$server" STATUS_AT)") |"
              else
                echo "| 올라간 것 | 아직 없음 |"
              fi
              if [ "$(value "$server" LEASE_ACTIVE)" = 1 ]; then
                echo "| 미리보기 자리 | PR #$(value "$server" LEASE_PR) · $(value "$server" LEASE_BY) · $(kst "$(value "$server" LEASE_UNTIL)") (KST) 까지 |"
              else
                echo "| 미리보기 자리 | 비어 있음(누구나 올릴 수 있다) |"
              fi
              echo "| 테스트 주소 응답 | API $(value "$server" EDGE_API) · 화면 $(value "$server" EDGE_PAGE) · 커밋 일치 $(value "$server" EDGE_RELEASE_MATCH) |"
              echo "| 컨테이너 | $(value "$server" STATUS_CONTAINERS) |"
              echo "| 서버 여유 | 메모리 $(value "$server" STATUS_MEM_AVAILABLE_MB) MB · 디스크 $(value "$server" STATUS_DISK_FREE_GB) GB |"
            else
              echo "| 올라간 것 | 서버가 꺼져 있어 켠 뒤에 보인다(켜면 마지막으로 올린 버전이 다시 뜬다) |"
            fi
            if [ -n "$perms" ]; then
              echo "| 배포 역할 권한 | 서버 켜기 $(yesno "$(value "$perms" PERM_START)") · 끄기 $(yesno "$(value "$perms" PERM_STOP)") |"
            fi
            echo
            echo "테스트 주소는 디스코드 고정 메시지에 있다. 다음에 누를 것:"
            if [ "$state" != running ]; then
              echo "- 테스트하려면 **켜기** 또는 바로 **PR 미리보기 올리기**"
            elif [ "$mode" = preview ]; then
              echo "- 다 봤으면 **미리보기 끝내기**, 오늘 끝이면 **끄기**"
            else
              echo "- PR 을 머지 전에 보려면 **PR 미리보기 올리기**, 오늘 끝이면 **끄기**"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
