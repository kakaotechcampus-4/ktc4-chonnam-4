name: Backend CI
# 로컬에서 같은 검사: bash scripts/verify.sh backend (Docker 필요 — 테스트 DB 는 Testcontainers 가 띄운다)

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'scripts/check-migrations.sh'
      - 'contracts/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'scripts/check-migrations.sh'
      - 'contracts/**'
      - '.github/workflows/backend-ci.yml'

# 같은 PR 에 새로 push 하면 이전 실행을 취소한다. develop·main push 는 취소하지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    # ubuntu-latest 는 2026-10-19 ~ 11-19 사이 26.04 로 바뀐다. 검증한 24.04 LTS 로 고정한다.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # PR 은 머지 커밋으로 체크아웃된다. 마이그레이션 가드가 첫 부모(= base 브랜치)와 비교한다.
          fetch-depth: 2

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # v6 기본값은 독점(proprietary) 캐시다. MIT 인 기본 캐시를 쓴다.
          cache-provider: basic

      - name: Migration guard
        if: github.event_name == 'pull_request'
        working-directory: .
        run: bash scripts/check-migrations.sh HEAD^1

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Test summary
        if: ${{ !cancelled() && hashFiles('backend/build/test-results/test/*.xml') != '' }}
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: backend/build/test-results/test/TEST-*.xml

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test/
          retention-days: 7

      # 커버리지는 참고용이다. 통과 기준으로 쓰지 않는다.
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('backend/build/reports/jacoco/test/html/index.html') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: backend/build/reports/jacoco/test/html/
          retention-days: 7
