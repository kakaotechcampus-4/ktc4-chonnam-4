name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # spring-boot-docker-compose is a developmentOnly dependency (bootRun/IDE
    # convenience) and isn't on the test classpath, so `./gradlew test` never
    # triggers backend/compose.yaml. CI provides Postgres via a service
    # container instead, matching the `local` profile's expected env vars.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: neuringo_local
          POSTGRES_USER: neuringo
          POSTGRES_PASSWORD: neuringo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuringo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://localhost:5432/neuringo_local
      DB_USERNAME: neuringo
      DB_PASSWORD: neuringo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon
