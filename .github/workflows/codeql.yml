name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '30 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    # 체크 이름은 "Analyze (java-kotlin)" 을 그대로 유지한다(필수 체크·브랜치 보호가 이 이름을 가리킬 수 있다).
    name: Analyze (${{ matrix.language }})
    # ubuntu-latest 는 2026-10-19 ~ 11-19 사이 26.04 로 바뀐다. 검증한 24.04 LTS 로 고정한다.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          # JS/TS 는 빌드 없이 소스만 분석한다.
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build backend
        if: matrix.build-mode == 'manual'
        working-directory: backend
        run: ./gradlew compileJava --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
          # Security 탭 업로드와 별도로 SARIF 파일을 남겨 Report job 이 표로 만든다.
          output: ${{ runner.temp }}/codeql-sarif

      - name: Keep SARIF for report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-sarif/*.sarif
          if-no-files-found: ignore
          retention-days: 7

  # 경고 목록(Security 탭)은 로그인한 레포 멤버만 볼 수 있고 메뉴 안쪽이라 찾기 어렵다.
  # 두 언어의 결과를 모아 실행 요약에 표로 남기고, PR 이면 코멘트 하나를 달아 push 할 때마다 고쳐 쓴다.
  report:
    name: Report
    needs: analyze
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download SARIF
        # 분석이 전부 실패해 파일이 없어도 요약에 "결과 없음"을 남기도록 계속 간다.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codeql-sarif-*
          path: ${{ runner.temp }}/codeql-sarif
          merge-multiple: true

      - name: Summarize
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/codeql-summary.sh "$RUNNER_TEMP/codeql-sarif" > "$RUNNER_TEMP/codeql-summary.md"
          cat "$RUNNER_TEMP/codeql-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        # 포크 PR 은 토큰에 쓰기 권한이 없어 건너뛴다.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- codeql-summary -->'
          body="$marker"$'\n'"$(cat "$RUNNER_TEMP/codeql-summary.md")"
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi
