name: Deploy
# develop 에 들어간 커밋을 팀 서버(dev)에 배포한다(docs/cd-architecture.md 3절). 화면·백엔드를 같은 커밋으로 함께 바꾼다.
#   자동: develop push 에서 Backend CI·Frontend CI 가 끝나면 → 그 커밋의 두 CI 가 모두 통과(또는 돌 필요 없음)했을 때만
#         release.yml(이미지 2개 빌드 → ECR → SSM 으로 서버 반영 → 상태 확인 → 안 되면 되돌림)을 부른다.
#         한 push 에 두 CI 가 다 돌면 나중에 끝난 쪽이 배포한다(먼저 끝난 쪽은 다른 CI 가 도는 중이라 건너뛴다).
#   수동: Actions → Deploy → Run workflow(develop 에서만). 커밋 SHA 를 넣으면 그 커밋으로 되돌린다(develop 에 있는 커밋만).
#         deploy/ 만 바뀐 커밋은 CI 가 돌지 않으므로 수동으로 배포한다. 설정값만 바꿨으면 "같은 커밋도 다시 띄움"을 켠다.
#   CI 가 늦게 끝났거나 옛 실행을 다시 돌려도 옛 커밋으로 내려가지 않는다(화면·백엔드를 바꾼 더 새 커밋이 있으면 건너뛴다).
#   서버가 꺼져 있거나 PR 미리보기가 자리를 쓰는 중이면 이미지만 올리고 건너뛴다(Dev server → 켜기·끝내기가 develop 최신으로 맞춘다).
# 준비가 안 됐으면 건너뛰고 Summary 에 이유를 남긴다: 변수 AWS_ACCOUNT_ID, Terraform 이 만든 인프라(Parameter Store).
# 공개 레포라 로그에 계정 ID·버킷·레지스트리 주소·테스트 주소를 찍지 않는다(스크립트가 가린다). 인증은 OIDC 뿐이다.

# workflow_run 은 기본 브랜치 권한으로 도는 트리거라 zizmor 가 위험하다고 본다(포크 PR 의 산출물을 믿으면 안 된다).
# 여기서는 같은 레포의 develop push 에서 온 실행만 받고(plan 의 if), develop 에 있는 커밋인지 확인한 뒤
# 그 커밋을 직접 checkout 해서 빌드한다. 트리거한 실행의 산출물(artifact)은 받지 않는다.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Backend CI, Frontend CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      ref:
        description: 배포할 커밋 SHA(40자리). 비우면 develop 최신
        required: false
        default: ""
      force:
        description: 같은 커밋이 떠 있어도 다시 띄움(Parameter Store 설정값만 바꿨을 때)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    # CI 가 통과한 같은 레포의 develop push 만 받는다. 포크·PR 에서 온 실행은 받지 않는다.
    # 수동 실행은 develop 에서만 받는다(다른 브랜치를 고르면 그 브랜치의 워크플로·스크립트가 돈다).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # ubuntu-latest 는 2026-10-19 ~ 11-19 사이 26.04 로 바뀐다. 검증한 24.04 LTS 로 고정한다.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # 같은 커밋의 다른 CI 결과를 본다
    outputs:
      sha: ${{ steps.what.outputs.sha }}
      go: ${{ steps.what.outputs.go }}

    steps:
      - name: Checkout (develop 이력)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Decide what to deploy
        id: what
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_REF: ${{ inputs.ref }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          skip() { # 이유
            echo "go=false" >>"$GITHUB_OUTPUT"
            printf '### 배포를 건너뛰었다\n\n%s\n' "$1" >>"$GITHUB_STEP_SUMMARY"
            echo "::notice title=배포 건너뜀::$1"
            exit 0
          }
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] ||
            skip "저장소 변수 \`AWS_ACCOUNT_ID\`(12자리)가 없다. Settings → Secrets and variables → Actions → **Variables** 에 등록한다."
          if [ "$EVENT" = workflow_dispatch ]; then
            sha=${INPUT_REF:-$(git rev-parse HEAD)}
          else
            sha=$RUN_SHA
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::커밋 SHA(40자리)가 아니다"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" HEAD; then
            echo "::error::develop 에 없는 커밋은 배포하지 않는다(PR 은 Dev server → PR 미리보기 올리기)"
            exit 1
          fi
          # 화면 이미지가 생기기 전 커밋으로 되돌리면 CloudFront 가 화면을 받을 곳이 없다(원본이 서버 하나).
          if ! git cat-file -e "$sha:frontend/Dockerfile" 2>/dev/null; then
            echo "::error::이 커밋에는 화면 이미지(frontend/Dockerfile)가 없어 배포할 수 없다(서버 하나가 화면·API 를 함께 내는 구조 이전 커밋)"
            exit 1
          fi
          if [ "$EVENT" != workflow_dispatch ]; then
            # 화면·백엔드를 바꾼 더 새 커밋이 develop 에 있으면 그 커밋의 CI 가 배포한다. 옛 커밋으로 내려가지 않는다.
            newer=$(git log --first-parent --format=%h "$sha..HEAD" -- backend frontend contracts | head -n 1)
            [ -z "$newer" ] || skip "화면·백엔드를 바꾼 더 새 커밋 $newer 이 develop 에 있다. 그 커밋의 CI 가 배포한다."
            # 같은 커밋의 두 CI 가 모두 끝나고 통과했을 때만. 아직 도는 쪽이 있으면 그쪽이 끝날 때 다시 판단한다.
            runs=$(gh api "repos/$REPO/actions/runs?head_sha=$sha&event=push&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "Backend CI" or .name == "Frontend CI")] | group_by(.name)
                    | map(max_by(.created_at)) | .[] | "\(.name)\t\(.status)\t\(.conclusion)"')
            while IFS=$'\t' read -r name status conclusion; do
              [ -n "$name" ] || continue
              [ "$status" = completed ] || skip "$name 가 아직 도는 중이다. 끝나면 그 실행이 배포한다."
              [ "$conclusion" = success ] || skip "$name 가 통과하지 못했다($conclusion). 고친 커밋이 develop 에 들어오면 배포한다."
            done <<<"$runs"
          fi
          { echo "sha=$sha"; echo "go=true"; } >>"$GITHUB_OUTPUT"
          echo "배포할 커밋 ${sha:0:7}"

  release:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    permissions:
      contents: read
      id-token: write # release.yml 의 잡들이 GitHub OIDC 로 AWS 임시 자격증명을 받는다
    uses: ./.github/workflows/release.yml
    with:
      sha: ${{ needs.plan.outputs.sha }}
      mode: develop
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
