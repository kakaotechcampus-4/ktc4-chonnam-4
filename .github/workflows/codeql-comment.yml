name: CodeQL comment
# 포크에서 온 PR 은 토큰이 읽기 전용이라 CodeQL 의 Report job 이 코멘트를 달지 못한다(분석·실행 요약은 그대로 된다).
# CodeQL 실행이 끝나면 이 워크플로가 기본 브랜치(develop)의 파일·권한으로 돌아 같은 코멘트를 단다.
# 같은 레포 브랜치에서 온 PR 은 Report job 이 이미 달았으므로 여기서는 받지 않는다.

# workflow_run 은 기본 브랜치 권한으로 도는 트리거라 zizmor 가 위험하다고 본다(포크 PR 의 산출물을 믿으면 안 된다).
# 여기서는 포크 코드를 실행하지 않는다.
#   - checkout 은 develop 이다. PR 코드를 받지 않는다.
#   - 트리거한 실행의 SARIF 는 데이터로만 읽어 develop 의 codeql-summary.sh(jq)로 표를 다시 만든다.
#     그 실행이 만든 요약 파일·PR 번호는 받지 않는다(포크가 워크플로를 고쳐 마음대로 쓸 수 있다).
#   - PR 번호는 head 저장소·브랜치로 열린 PR 을 찾고, head 가 분석한 커밋과 같을 때만 쓴다(codeql-comment.sh find).
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CodeQL]
    types: [completed]

# 같은 PR 의 코멘트를 두 실행이 동시에 새로 달지 않게 한 줄로 세운다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions: {}

jobs:
  comment:
    name: Comment on fork PR
    # 취소된 실행은 새 push 가 다시 돌리므로 건너뛴다. 실패한 실행은 "결과 없음"이라도 단다.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    # ubuntu-latest 는 2026-10-19 ~ 11-19 사이 26.04 로 바뀐다. 검증한 24.04 LTS 로 고정한다.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - name: Checkout (develop)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(bash scripts/codeql-comment.sh find "$HEAD_REPO" "$HEAD_BRANCH" "$HEAD_SHA")
          if [ -z "$pr" ]; then
            echo "::notice title=코멘트 건너뜀::분석한 커밋을 head 로 둔 열린 PR 이 없다(그 뒤 push 했거나 PR 이 닫혔다)"
          fi
          echo "number=$pr" >>"$GITHUB_OUTPUT"

      - name: Download SARIF
        if: steps.pr.outputs.number != ''
        # 분석이 전부 실패해 파일이 없어도 "결과 없음"을 달도록 계속 간다.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: codeql-sarif-*
          path: ${{ runner.temp }}/codeql-sarif
          merge-multiple: true

      - name: Summarize and comment
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          LINK_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          bash scripts/codeql-summary.sh "$RUNNER_TEMP/codeql-sarif" > "$RUNNER_TEMP/codeql-summary.md"
          cat "$RUNNER_TEMP/codeql-summary.md" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/codeql-comment.sh post "$PR_NUMBER" "$RUNNER_TEMP/codeql-summary.md"
