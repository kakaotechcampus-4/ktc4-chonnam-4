# 개발 서버 배포 구성: 백엔드 이미지 + PostgreSQL 18.6.
#   서버: .github/workflows/deploy-dev.yml 이 이 파일과 .env 를 서버에 올리고 docker compose up 으로 띄운다.
#   로컬 확인: bash scripts/verify.sh docker (local 프로필로 띄워 GET /api/v1/csrf 200 을 본다)
# 값은 같은 폴더의 .env 에서 읽는다(.env.example 참고). 이 파일에는 값을 적지 않는다.
name: neuringo-dev

services:
  postgres:
    # backend/compose.yml·TestcontainersConfiguration 과 같은 버전으로 고정한다.
    image: postgres:18.6
    environment:
      POSTGRES_DB: "${DB_NAME:?.env 에 DB_NAME 이 필요합니다}"
      POSTGRES_USER: "${DB_USERNAME:?.env 에 DB_USERNAME 이 필요합니다}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?.env 에 DB_PASSWORD 가 필요합니다}"
    # DB 포트는 열지 않는다. 같은 네트워크의 backend 만 접속한다.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: "${APP_IMAGE:?.env 에 APP_IMAGE 가 필요합니다}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # dev 프로필은 local 과 같은 토큰 인증이다. 가입·로그인·CSRF 토큰 말고는 로그인해야 하고, health 도 지금은 401 이다(공개 여부는 팀 결정 전).
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-dev}"
      DB_URL: "jdbc:postgresql://postgres:5432/${DB_NAME}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
    # 기본은 서버 안(127.0.0.1)에만 연다. 외부 공개는 도메인·리버스 프록시가 정해지면 APP_BIND 로 바꾼다.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
