# 서버 배포 구성: 백엔드 이미지 + PostgreSQL 18.6 (EC2 t3.medium 1대, 메모리 4 GiB).
#   서버: deploy/host/deploy.sh 가 Parameter Store 에서 .env 를 만들고(권한 600) 이 파일로 띄운다(docs/cd-architecture.md).
#   로컬 확인: bash scripts/verify.sh docker (local 프로필로 띄워 GET /api/v1/csrf 200 을 본다)
# 이 파일에는 값을 적지 않는다. 값은 --env-file 로 받는다(.env.example 참고).
name: neuringo-dev

services:
  postgres:
    # backend/compose.yml·TestcontainersConfiguration 과 같은 버전으로 고정한다.
    image: postgres:18.6
    environment:
      POSTGRES_DB: "${DB_NAME:?.env 에 DB_NAME 이 필요합니다}"
      POSTGRES_USER: "${DB_USERNAME:?.env 에 DB_USERNAME 이 필요합니다}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?.env 에 DB_PASSWORD 가 필요합니다}"
    # DB 포트는 열지 않는다. 같은 네트워크의 backend 만 접속한다.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 서버 메모리 4 GiB 를 backend·OS 와 나눠 쓴다.
    mem_limit: "${POSTGRES_MEM_LIMIT:-768m}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  backend:
    image: "${APP_IMAGE:?.env 에 APP_IMAGE 가 필요합니다}"
    depends_on:
      postgres:
        condition: service_healthy
    # deploy/host/params.txt 에 적힌 설정값(AI 제공자 등)만 들어 있는 파일이다. 없으면(로컬 검사) 건너뛴다.
    # 비어 있는 값을 environment 에 적으면 application.yml 기본값 대신 빈 문자열이 들어가서, 있을 때만 넘기려고 env_file 을 쓴다.
    env_file:
      - path: "${APP_ENV_FILE:-./neuringo.env}"
        required: false
    environment:
      # dev 프로필은 local 과 같은 토큰 인증이다. 가입·로그인·CSRF 토큰 말고는 로그인해야 하고, health 도 지금은 401 이다(공개 여부는 팀 결정 전).
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-dev}"
      # 기본은 같은 서버의 postgres 컨테이너다. RDS 로 옮기면 Parameter Store 의 db/url 하나만 넣는다.
      DB_URL: "${DB_URL:-jdbc:postgresql://postgres:5432/${DB_NAME}}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
    # 기본은 서버 안(127.0.0.1)에만 연다. 서버에서는 deploy.sh 가 0.0.0.0:80 으로 연다(보안 그룹은 CloudFront 만 허용).
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    # 상한이 없으면 JVM(MaxRAMPercentage=75)이 서버 전체 4 GiB 기준으로 힙을 잡는다. 1.5 GiB 면 힙은 약 1.1 GiB 다.
    mem_limit: "${BACKEND_MEM_LIMIT:-1536m}"
    # Spring 의 graceful shutdown(20초)이 끝날 때까지 기다린다.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

volumes:
  postgres-data:
