services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: neuringo_local
      POSTGRES_USER: neuringo
      POSTGRES_PASSWORD: neuringo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuringo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
