services:
  postgres:
    # 마이너 버전까지 고정한다(18 은 받는 시점마다 18.x 가 바뀌는 태그다).
    # 올릴 때는 TestcontainersConfiguration 의 postgres:18.x-alpine 도 같이 올린다.
    image: postgres:18.6
    environment:
      POSTGRES_DB: "${DB_NAME:?backend/.env 가 없습니다. .env.example 을 복사해 채워주세요}"
      POSTGRES_USER: "${DB_USERNAME:?backend/.env 에 DB_USERNAME 이 필요합니다}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?backend/.env 에 DB_PASSWORD 가 필요합니다}"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
