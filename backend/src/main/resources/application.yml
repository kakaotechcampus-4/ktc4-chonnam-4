spring:
  application:
    name: neuringo-be

  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:none}
    openai:
      base-url: ${AI_BASE_URL:https://api.openai.com}
      api-key: ${AI_API_KEY:not-configured}
      timeout: ${AI_TIMEOUT:10s}
      max-retries: ${AI_MAX_RETRIES:0}
      chat:
        model: ${AI_MODEL:not-configured}

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    locations: classpath:db/migration

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.neuringo: INFO

neuringo:
  child-access:
    hmac-secret: ${CHILD_ACCESS_HMAC_SECRET:}
  ai:
    provider-name: ${AI_PROVIDER_NAME:openai-compatible}
    model: ${AI_MODEL:}
    request-timeout: ${AI_TIMEOUT:10s}
    max-retries: ${AI_MAX_RETRIES:0}
    stt:
      provider: ${STT_PROVIDER:none}
      provider-name: ${STT_PROVIDER_NAME:openai}
      base-url: ${STT_BASE_URL:https://api.openai.com}
      api-key: ${STT_API_KEY:}
      model: ${STT_MODEL:gpt-4o-mini-transcribe}
      language: ${STT_LANGUAGE:ko}
      request-timeout: ${STT_TIMEOUT:15s}
      include-logprobs: ${STT_INCLUDE_LOGPROBS:true}
    tts:
      provider: ${TTS_PROVIDER:none}
      provider-name: ${TTS_PROVIDER_NAME:typecast}
      base-url: ${TTS_BASE_URL:https://api.typecast.ai}
      api-key: ${TTS_API_KEY:}
      model: ${TTS_MODEL:ssfm-v30}
      voice-id: ${TTS_VOICE_ID:}
      language: ${TTS_LANGUAGE:kor}
      audio-format: ${TTS_AUDIO_FORMAT:mp3}
      request-timeout: ${TTS_TIMEOUT:15s}
