spring:
  application:
    name: neuringo-be

  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:none}
    openai:
      base-url: ${AI_BASE_URL:https://api.openai.com}
      api-key: ${AI_API_KEY:not-configured}
      timeout: ${AI_TIMEOUT:10s}
      max-retries: ${AI_MAX_RETRIES:0}
      chat:
        model: ${AI_MODEL:not-configured}

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    # 스키마는 db/migration(V 파일), 퀴즈 문항 풀은 db/seed(반복 실행 파일)에 둔다.
    locations: classpath:db/migration,classpath:db/seed

  lifecycle:
    # 서버 종료 시 진행 중인 요청을 최대 70초 기다린다. 최대 60초인 역할극 응답을 마칠 여유를 둔다.
    timeout-per-shutdown-phase: 70s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # 서버에서는 화면 컨테이너(nginx) 뒤에서 돈다. nginx 가 넘기는 X-Forwarded-Proto 로 https 인 줄 알아야
  # CSRF 쿠키·아동 세션 쿠키처럼 요청의 https 여부를 따르는 쿠키에 Secure 가 붙는다. 이 헤더는 Tomcat 이 믿는 프록시(사설·루프백 주소, 기본값)에서 온 것만 쓴다.
  # backend 는 compose 네트워크 안에만 있어 밖에서 직접 보낸 헤더는 닿지 않는다. 확인: scripts/docker-smoke.sh, frontend/e2e/deployed/edge.spec.ts
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

roleplay:
  speech:
    # 음성 미제공도 명시적으로 선택한다. 미설정 시 전달 구현을 대신 만들지 않는다.
    #   none:   글만 보낸다(TTS 를 켜 두어도 소리가 나지 않는다).
    #   inline: 합성한 음성을 응답 안의 data URL 로 함께 보내 화면이 바로 재생한다. 서버에 음성을 저장하지 않는다.
    delivery: ${ROLEPLAY_SPEECH_DELIVERY:}
  input:
    stt-confidence-threshold: ${ROLEPLAY_STT_CONFIDENCE_THRESHOLD:0.40}
  text:
    enabled: ${ROLEPLAY_TEXT_ENABLED:false}
    maximum-characters: ${ROLEPLAY_TEXT_MAXIMUM_CHARACTERS:}
  http:
    # S4 승인 시나리오와 입력 처리·음성 전달 구현이 준비된 뒤 명시적으로 켠다.
    enabled: ${ROLEPLAY_HTTP_ENABLED:false}
    spool-directory: ${ROLEPLAY_SPOOL_DIRECTORY:}
    maximum-upload-bytes: ${ROLEPLAY_UPLOAD_MAX_BYTES:}
    maximum-request-bytes: ${ROLEPLAY_REQUEST_MAX_BYTES:}
    allowed-formats: ${ROLEPLAY_ALLOWED_FORMATS:}
    worker-count: ${ROLEPLAY_WORKER_COUNT:}
    queue-capacity: ${ROLEPLAY_QUEUE_CAPACITY:}
    turn-budget: ${ROLEPLAY_TURN_BUDGET:60s}
  progress:
    # 확정된 제한만 명시적으로 공급하며 미설정 시 새 대화 문맥을 만들지 않는다.
    maximum-turn-count: ${ROLEPLAY_MAXIMUM_TURN_COUNT:}
    maximum-support-turns-per-micro-goal: ${ROLEPLAY_MAXIMUM_SUPPORT_TURNS_PER_MICRO_GOAL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.neuringo: INFO

neuringo:
  # 가입 동의를 받는 약관 버전. 약관 본문이 바뀌면 올린다.
  consent:
    terms-version: v1
    privacy-version: v1
  child-access:
    hmac-secret: ${CHILD_ACCESS_HMAC_SECRET:}
    # 입장 코드(4자리) 무차별 대입 늦추기. 접속 IP 별로 틀린 코드(INVALID_ACCESS_CODE·ACCESS_CODE_EXPIRED)만 센다 — 맞은 입장은
    # 세지 않아 학교 NAT 로 한 반이 함께 들어와도 걸리지 않는다. 첫 실패부터 window 안에 max-failures 번째로 틀리면 그 IP 의
    # 입장을 block-for 동안 429 ACCESS_CODE_ATTEMPTS_EXCEEDED(Retry-After 초)로 막는다. 서버 메모리에만 둔다(배포 때 지워진다).
    # 앞단 nginx 의 IP 별 요청 수 제한(frontend/nginx.conf, 분당 60번)과 따로 돈다. 검사: ChildEntryAttemptLimiterTest, docker-smoke
    attempt-limit:
      max-failures: 30
      window: 10m
      block-for: 10m
      max-tracked-clients: 10000
  ai:
    provider-name: ${AI_PROVIDER_NAME:openai-compatible}
    model: ${AI_MODEL:}
    request-timeout: ${AI_TIMEOUT:10s}
    max-retries: ${AI_MAX_RETRIES:0}
    # 비우면 보내지 않는다. 엘리스 게이트웨이는 비스트리밍 출력 2,000토큰(추론 포함)까지만 받는다.
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:}
    reasoning-effort: ${AI_REASONING_EFFORT:}
    # 호출 목적별 모델 경로. base-url 과 model 이 둘 다 있을 때만 켜지고, 비어 있으면 위 기본 모델로 간다.
    routes:
      report-generation:
        base-url: ${AI_REPORT_GENERATION_BASE_URL:}
        model: ${AI_REPORT_GENERATION_MODEL:}
        request-timeout: ${AI_REPORT_GENERATION_TIMEOUT:60s}
        max-output-tokens: ${AI_REPORT_GENERATION_MAX_OUTPUT_TOKENS:2000}
        reasoning-effort: ${AI_REPORT_GENERATION_REASONING_EFFORT:}
      report-review:
        base-url: ${AI_REPORT_REVIEW_BASE_URL:}
        model: ${AI_REPORT_REVIEW_MODEL:}
        request-timeout: ${AI_REPORT_REVIEW_TIMEOUT:90s}
        max-output-tokens: ${AI_REPORT_REVIEW_MAX_OUTPUT_TOKENS:2000}
        reasoning-effort: ${AI_REPORT_REVIEW_REASONING_EFFORT:}
    stt:
      provider: ${STT_PROVIDER:none}
      provider-name: ${STT_PROVIDER_NAME:openai}
      base-url: ${STT_BASE_URL:https://api.openai.com}
      api-key: ${STT_API_KEY:}
      model: ${STT_MODEL:gpt-4o-mini-transcribe}
      language: ${STT_LANGUAGE:ko}
      request-timeout: ${STT_TIMEOUT:15s}
      include-logprobs: ${STT_INCLUDE_LOGPROBS:true}
    tts:
      # typecast 또는 openai. 이름·주소·모델·언어·목소리를 비우면 공급자별 기본값을 쓴다(TextToSpeechProperties).
      #   typecast: api.typecast.ai · ssfm-v30 · kor · 목소리 ID 필수
      #   openai:   api.openai.com · gpt-4o-mini-tts · 목소리 nova (STT 와 같은 OpenAI 키를 쓸 수 있다)
      provider: ${TTS_PROVIDER:none}
      provider-name: ${TTS_PROVIDER_NAME:}
      base-url: ${TTS_BASE_URL:}
      api-key: ${TTS_API_KEY:}
      model: ${TTS_MODEL:}
      voice-id: ${TTS_VOICE_ID:}
      language: ${TTS_LANGUAGE:}
      audio-format: ${TTS_AUDIO_FORMAT:mp3}
      request-timeout: ${TTS_TIMEOUT:15s}
  # 역할극 리포트·다음 난이도·추천(backend/docs/roleplay-report-integration.md).
  report:
    workers: ${REPORT_WORKERS:1}
    queue-capacity: ${REPORT_QUEUE_CAPACITY:50}
    stale-after: ${REPORT_STALE_AFTER:10m}
    max-attempts: ${REPORT_MAX_ATTEMPTS:3}
    # 팀 결정 대기: L1(S2 시작) 역할극 만점에서도 확장 추천을 낼지. true 가 지금 정책이다.
    extend-from-lowest-level: ${REPORT_EXTEND_FROM_LOWEST_LEVEL:true}
    difficulty:
      # 팀 결정 대기: 상향 후보 기준(기본 80)과 빠른 상향(기본 끔, DEC-014). 바꾸면 정책 버전 뒤에 값이 붙는다.
      upgrade-threshold-percent: ${REPORT_UPGRADE_THRESHOLD_PERCENT:80}
      fast-upgrade-percent: ${REPORT_FAST_UPGRADE_PERCENT:}
