spring:
  application:
    name: neuringo-be

  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:none}
    openai:
      base-url: ${AI_BASE_URL:https://api.openai.com}
      api-key: ${AI_API_KEY:not-configured}
      timeout: ${AI_TIMEOUT:10s}
      max-retries: ${AI_MAX_RETRIES:0}
      chat:
        model: ${AI_MODEL:not-configured}

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    locations: classpath:db/migration

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.neuringo: INFO

neuringo:
  ai:
    provider-name: ${AI_PROVIDER_NAME:openai-compatible}
    request-timeout: ${AI_TIMEOUT:10s}
    max-retries: ${AI_MAX_RETRIES:0}
