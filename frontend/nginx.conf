# 화면 이미지(frontend/Dockerfile)의 nginx 설정. 빌드할 때 __RELEASE__ 를 커밋 SHA 로 바꾼다.
#   /api/     → 같은 compose 의 backend:8080 (캐시·버퍼 설정 없이 그대로 넘긴다)
#   /assets/  → 빌드한 파일. 이름에 해시가 있어 오래 캐시한다. 없는 파일은 404(index.html 을 돌려주면 그게 캐시된다)
#   그 밖     → 화면 주소(/classrooms 같은 SPA 경로)는 index.html. 캐시하지 않는다(새 배포가 바로 보이게)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # 음성 한 턴은 최대 2 MB(계약 문서). 여유를 둔다. 백엔드 한도는 Spring 설정이 따로 정한다.
    client_max_body_size 5m;

    # 아래 location 들이 add_header 를 따로 쓰지 않아서 이 헤더가 모든 응답에 붙는다(오류 응답 포함, always).
    add_header X-Neuringo-Release "__RELEASE__" always;

    # backend 컨테이너가 다시 만들어지면 IP 가 바뀐다. Docker 내장 DNS 로 요청마다(10초 캐시) 다시 찾는다.
    # 변수로 넘기면 nginx 가 뜰 때 backend 가 없어도 시작은 된다(요청은 502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        # 변수에 경로를 붙이지 않았으므로 요청 경로·쿼리를 그대로 넘긴다.
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # CloudFront 응답 대기(60초)보다 조금 길게. 그 전에 끊으면 CloudFront 가 아닌 nginx 의 502 가 된다.
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    location /assets/ {
        try_files $uri =404;
        expires max;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
