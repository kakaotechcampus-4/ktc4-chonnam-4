# 화면 이미지(frontend/Dockerfile)의 nginx 설정. 빌드할 때 __RELEASE__ 를 커밋 SHA 로 바꾼다.
#   /api/     → 같은 compose 의 backend:8080 (캐시·버퍼 설정 없이 그대로 넘긴다)
#   /assets/  → 빌드한 파일. 이름에 해시가 있어 오래 캐시한다. 없는 파일은 404(index.html 을 돌려주면 그게 캐시된다)
#   그 밖     → 화면 주소(/classrooms 같은 SPA 경로)는 index.html. 캐시하지 않는다(새 배포가 바로 보이게)

# 브라우저가 쓴 프로토콜. CloudFront 는 서버에 http 로 오고 CloudFront-Forwarded-Proto 로 원래 프로토콜(https)을 알려 준다.
# 백엔드가 이것을 X-Forwarded-Proto 로 받아야 https 인 줄 알고 쿠키에 Secure 를 붙인다. 그 밖의 값·직접 온 요청은 nginx 가 받은 프로토콜.
map $http_cloudfront_forwarded_proto $forwarded_proto {
    https   https;
    http    http;
    default $scheme;
}

# 접속한 사람의 IP. CloudFront 는 CloudFront-Viewer-Address(IP:포트)로 알려 준다. 백엔드에는 이 IP 하나만 X-Forwarded-For 로
# 넘긴다 — 브라우저가 넣은 X-Forwarded-For 는 믿지 않고 덮어쓴다. 헤더가 없으면(로컬 검사) nginx 가 본 주소.
map $http_cloudfront_viewer_address $viewer_ip {
    "~^(?<ip>.+):[0-9]+$" $ip;
    default               $remote_addr;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # 음성 한 턴은 최대 2 MB(계약 문서). 여유를 둔다. 백엔드 한도는 Spring 설정이 따로 정한다.
    client_max_body_size 5m;

    # 아래 location 들이 add_header 를 따로 쓰지 않아서 이 헤더가 모든 응답에 붙는다(오류 응답 포함, always).
    add_header X-Neuringo-Release "__RELEASE__" always;

    # backend 컨테이너가 다시 만들어지면 IP 가 바뀐다. Docker 내장 DNS 로 요청마다(10초 캐시) 다시 찾는다.
    # 변수로 넘기면 nginx 가 뜰 때 backend 가 없어도 시작은 된다(요청은 502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        # 변수에 경로를 붙이지 않았으므로 요청 경로·쿼리를 그대로 넘긴다.
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $viewer_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # 브라우저가 넣은 값이 백엔드의 주소 계산(Tomcat RemoteIpValve)에 쓰이지 않게 지운다.
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        # 서버 한 턴 상한(최대 60초)보다 길고 CloudFront 응답 대기(120초)보다 짧게. 서버가 먼저 끝내야 서버가 만든 응답이
        # 그대로 간다. 서버가 멈췄을 때는 nginx 의 504 가 먼저 나가서 CloudFront 가 GET 을 다시 보내지 않는다.
        proxy_read_timeout 110s;
        proxy_send_timeout 110s;
    }

    location /assets/ {
        try_files $uri =404;
        expires max;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
